function readM(v){var m=MEF;if(!m)return;m.n=v("mf_n");m.ds=v("mf_ds");m.p=Math.max(0,+v("mf_p")||0);m.k=v("mf_k")||m.k;m.c=v("mf_c")||m.c;m.ic=v("mf_ic")||m.ic;m.rd=+v("mf_rd")||0;m.val=+v("mf_val")||0;m.we=+v("mf_we")||0}
function actM(p,v){var i,m,r,x;switch(p[0]){
case "tm":mtoggle(p[1]);break;
case "mt":MT=p[1];MEF=null;break;
case "mv":mvalidate(p[1],p[2]=="1");break;
case "mu":mundo(p[1]);break;
case "ma":m=mfm(p[1]);if(m){m.on=m.on?0:1}break;
case "mne":MEF={id:"",n:"",ds:"",k:"v",c:"d",p:2,ic:"✦",rd:0,val:0,we:0};break;
case "mee":m=mfm(p[1]);if(m)MEF={id:m.id,n:m.n,ds:m.ds||"",k:m.k,c:m.c,p:m.p,ic:m.ic,rd:m.rd,val:m.val,we:m.dw.length?1:0};break;
case "mfx":MEF=null;break;
case "mfs":readM(v);x=MEF;if(!x.n){toast("Falta el nombre");return true}
if(x.k=="co")x.c="c";else if(x.c=="c")x.k="co";
if(x.k=="co")x.val=1;
if(x.id){m=mfm(x.id)}else{m={id:uid(),cid:"",on:1,r:null};S.ms.push(m)}
m.n=x.n;m.ds=x.ds;m.k=x.k;m.c=x.c;m.p=x.p;m.ic=x.ic;m.rd=x.rd;m.val=x.val;m.dw=x.we?[6,0]:[];MEF=null;break;
case "cht":for(i=0;i<S.ch.length;i++)if(S.ch[i].id==p[1]){cfread(v);S.ch[i].on=S.ch[i].on?0:1}break;
case "cfs":cfread(v);toast("Configuración guardada");break;
case "rwt":r=rwf(p[1]);if(r)r.on=r.on?0:1;break;
case "rwd":for(i=0;i<S.rw.length;i++)if(S.rw[i].id==p[1])S.rw.splice(i,1);break;
case "rws":for(i=0;i<S.rw.length;i++){r=S.rw[i];r.n=v("rn_"+r.id)||r.n;r.c=Math.max(1,+v("rc_"+r.id)||r.c)}toast("Guardado");break;

case "rr":rrq(p[1],p[2]);break;
case "rq":rqdo(p[1],p[2]=="1");break;

case "adj":x=v("aj_w");if(!x){toast("Escribe el motivo");return true}i=Math.round(+v("aj_n")||0);if(!i){toast("Indica la cantidad");return true}adjust(v("aj_k"),i,x,v("aj_t"));break;
default:return false}
return true}
